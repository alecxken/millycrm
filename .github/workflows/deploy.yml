name: Test & deploy

# Every push to main is tested on PHP 8.3 (same as the server) and, if green,
# deployed to https://crm.tenzatech.co.ke. Pull requests are tested only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://crm.tenzatech.co.ke
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/millycrm' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Assets are built here so the 1 GB droplet never needs Node.
      - name: Build front-end assets
        run: npm ci && npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host production"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port $DEPLOY_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Upload built assets
        run: |
          ssh production "mkdir -p '$DEPLOY_PATH/public/build'"
          rsync -az --delete -e ssh public/build/ "production:$DEPLOY_PATH/public/build/"

      - name: Run deploy script on server
        run: |
          ssh production "cd '$DEPLOY_PATH' && git fetch -q origin main && git checkout -q origin/main -- scripts/deploy.sh && APP_DIR='$DEPLOY_PATH' BRANCH=main bash scripts/deploy.sh"

      - name: Smoke check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://crm.tenzatech.co.ke/login)
          echo "GET /login -> $code"
          test "$code" = "200"
